name: Release

# Publishes a GitHub Release with the Windows installer, a portable Windows
# zip, and Linux and macOS zips (spec S4). The version is config/version in
# project.godot ("0.1 Dev 1"); tools/version.sh turns it into the tag
# (v0.1-dev.1), file names and Windows version number (VERSIONING.md).
# Three ways in:
#  - push a tag that matches project.godot's version (v0.1-dev.1)
#  - Actions tab -> Release -> Run workflow (releases project.godot's version
#    and creates the tag)
#  - a pull request that touches the pipeline: builds everything as a dry run
#    (downloadable from the run's Artifacts) and publishes nothing
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the GitHub Release (untick for a dry run)"
        required: true
        type: boolean
        default: true
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/actions/**"
      - "installer/**"
      - "THIRD_PARTY_NOTICES.txt"
      - "export_presets.cfg"
      - "project.godot"
      - "tools/version.sh"
      - "tools/changelog_section.sh"
      - "tools/changelog.sh"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.2" # must match the project (spec S2 step 2)
  GODOT_STATUS: "stable"

jobs:
  version:
    name: Work out the version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      tag: ${{ steps.v.outputs.tag }}
      number: ${{ steps.v.outputs.number }}
      publish: ${{ steps.v.outputs.publish }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          OUT=$(tools/version.sh)
          NAME=$(sed -n 's/^name=//p' <<< "$OUT")
          TAG=$(sed -n 's/^tag=//p' <<< "$OUT")
          case "$EVENT" in
            push)              PUBLISH=true ;;
            workflow_dispatch) PUBLISH="$INPUT_PUBLISH" ;;
            *)                 PUBLISH=false ;;
          esac
          if [ "$EVENT" = "push" ] && [ "$GITHUB_REF_NAME" != "v$TAG" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match the game's version '$NAME' in project.godot (its tag is v$TAG). See VERSIONING.md."; exit 1
          fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$PUBLISH" = "true" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Releases are published from main. Pick main in 'Use workflow from', or untick Publish for a dry run."; exit 1
          fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$PUBLISH" = "true" ] \
             && git rev-parse -q --verify "refs/tags/v$TAG" >/dev/null; then
            echo "::error::$NAME (v$TAG) has already been released. Set the next version in project.godot first (see VERSIONING.md)."; exit 1
          fi
          echo "$OUT" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          { echo "Version $NAME, publish=$PUBLISH"; echo '```'; echo "$OUT"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  export:
    name: Test and export
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          status: ${{ env.GODOT_STATUS }}
          templates: "true"

      - name: Smoke test (the bot plays; no script errors allowed)
        run: tools/smoke_test.sh

      - name: Export Windows, Linux and macOS
        run: |
          set -euo pipefail
          mkdir -p build/windows build/linux build/macos
          godot --headless --path . --export-release "Windows Desktop" build/windows/KatanaShotgun.exe
          godot --headless --path . --export-release "Linux" build/linux/KatanaShotgun.x86_64
          godot --headless --path . --export-release "macOS" build/macos/KatanaShotgun.zip \
            || { echo "::warning::macOS export failed; releasing without it"; rm -f build/macos/*; }
          test -s build/windows/KatanaShotgun.exe
          test -s build/linux/KatanaShotgun.x86_64
          chmod +x build/linux/KatanaShotgun.x86_64
          ls -la build/*

      - name: Check the Linux build starts and plays
        run: |
          timeout 120 build/linux/KatanaShotgun.x86_64 --headless --quit-after 600 -- --autoplay --god 2>&1 | tee exported.log
          grep -q "^\[t=" exported.log
          ! grep -qE "SCRIPT ERROR|Parse Error" exported.log

      - uses: actions/upload-artifact@v7
        with:
          name: builds
          path: build/
          retention-days: 7

  installer:
    name: Windows installer
    needs: [version, export]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: builds
          path: build

      - name: Build the installer with Inno Setup
        shell: pwsh
        env:
          NAME: ${{ needs.version.outputs.name }}
          TAG: ${{ needs.version.outputs.tag }}
          NUMBER: ${{ needs.version.outputs.number }}
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup (ISCC.exe) not found" }
          Write-Host "Using $($iscc.FullName)"
          & $iscc.FullName "/DAppVersion=$env:NAME" "/DAppTag=$env:TAG" "/DAppNumber=$env:NUMBER" installer\KatanaShotgun.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem dist

      - name: Check the installer installs and uninstalls silently
        shell: pwsh
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          $setup = "dist\KatanaShotgun-v$env:TAG-Windows-Setup.exe"
          $dir = "$env:RUNNER_TEMP\KatanaShotgunTest"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          if (-not (Test-Path "$dir\KatanaShotgun.exe")) { throw "game exe missing after install" }
          if (-not (Test-Path "$dir\THIRD_PARTY_NOTICES.txt")) { throw "licence notices missing after install" }
          $p = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstaller exit code $($p.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\KatanaShotgun.exe") { throw "game exe still there after uninstall" }
          Write-Host "Install and uninstall OK"

      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: dist/*.exe
          retention-days: 7

  release:
    name: Package and publish
    needs: [version, export, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NAME: ${{ needs.version.outputs.name }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # release notes fall back to changelog.d/, ordered by history

      - uses: actions/download-artifact@v8
        with:
          name: builds
          path: art/builds

      - uses: actions/download-artifact@v8
        with:
          name: installer
          path: art/installer

      - name: Package the downloads
        run: |
          set -euo pipefail
          mkdir -p dist
          cp art/installer/*.exe dist/
          # Every download carries the third-party licences next to the game.
          NOTICES="$GITHUB_WORKSPACE/THIRD_PARTY_NOTICES.txt"
          test -s "$NOTICES"
          (cd art/builds/windows && zip -9 "$GITHUB_WORKSPACE/dist/KatanaShotgun-v${TAG}-Windows-Portable.zip" KatanaShotgun.exe)
          zip -9 -j "dist/KatanaShotgun-v${TAG}-Windows-Portable.zip" "$NOTICES"
          chmod +x art/builds/linux/KatanaShotgun.x86_64
          (cd art/builds/linux && zip -9 "$GITHUB_WORKSPACE/dist/KatanaShotgun-v${TAG}-Linux.zip" KatanaShotgun.x86_64)
          zip -9 -j "dist/KatanaShotgun-v${TAG}-Linux.zip" "$NOTICES"
          if [ -f art/builds/macos/KatanaShotgun.zip ]; then
            cp art/builds/macos/KatanaShotgun.zip "dist/KatanaShotgun-v${TAG}-macOS.zip"
            zip -9 -j "dist/KatanaShotgun-v${TAG}-macOS.zip" "$NOTICES"
          fi
          for z in dist/*.zip; do unzip -l "$z" | grep THIRD_PARTY_NOTICES.txt > /dev/null || { echo "::error::$z has no notices"; exit 1; }; done
          ls -la dist

      - name: Release notes from the changelog
        run: tools/changelog_section.sh "$NAME" > release_notes.md; cat release_notes.md

      - name: Keep the packaged downloads (dry runs too)
        uses: actions/upload-artifact@v7
        with:
          name: KatanaShotgun-v${{ env.TAG }}
          path: dist/*
          retention-days: 14

      - name: Publish the GitHub Release
        if: needs.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: KATANA / SHOTGUN ${{ env.NAME }}
          body_path: release_notes.md
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: dist/*
