name: Release

# Publishes a GitHub Release with the Windows installer, a portable Windows
# zip, and Linux and macOS zips (spec S4). Three ways in:
#  - push a tag vX.Y.Z
#  - Actions tab -> Release -> Run workflow, type the version (creates the tag)
#  - a pull request that touches the pipeline: builds everything as a dry run
#    (downloadable from the run's Artifacts) and publishes nothing
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (for example 0.3.1)"
        required: true
        type: string
      publish:
        description: "Publish the GitHub Release (untick for a dry run)"
        required: true
        type: boolean
        default: true
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/actions/**"
      - "installer/**"
      - "export_presets.cfg"
      - "project.godot"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.2" # must match the project (spec S2 step 2)
  GODOT_STATUS: "stable"

jobs:
  version:
    name: Work out the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            push)              VER="${GITHUB_REF_NAME#v}"; PUBLISH=true ;;
            workflow_dispatch) VER="${INPUT_VERSION#v}"; PUBLISH="$INPUT_PUBLISH" ;;
            *)                 VER="0.0.0-pr.${PR_NUMBER}"; PUBLISH=false ;;
          esac
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$VER' is not a version like 0.3.1"; exit 1
          fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$PUBLISH" = "true" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Releases are published from main. Pick main in 'Use workflow from', or untick Publish for a dry run."; exit 1
          fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$PUBLISH" = "true" ] \
             && git rev-parse -q --verify "refs/tags/v$VER" >/dev/null; then
            echo "::error::v$VER has already been released. Pick a new version number."; exit 1
          fi
          PRE=false
          if [[ "$VER" == 0.* || "$VER" == *-* ]]; then PRE=true; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "Version $VER, publish=$PUBLISH, prerelease=$PRE" >> "$GITHUB_STEP_SUMMARY"

  export:
    name: Test and export
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VER: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          status: ${{ env.GODOT_STATUS }}
          templates: "true"

      - name: Stamp the version into the game
        run: |
          sed -i "s/^config\/version=.*/config\/version=\"${VER}\"/" project.godot
          grep '^config/version=' project.godot

      - name: Smoke test (the bot plays; no script errors allowed)
        run: tools/smoke_test.sh

      - name: Export Windows, Linux and macOS
        run: |
          set -euo pipefail
          mkdir -p build/windows build/linux build/macos
          godot --headless --path . --export-release "Windows Desktop" build/windows/KatanaShotgun.exe
          godot --headless --path . --export-release "Linux" build/linux/KatanaShotgun.x86_64
          godot --headless --path . --export-release "macOS" build/macos/KatanaShotgun.zip \
            || { echo "::warning::macOS export failed; releasing without it"; rm -f build/macos/*; }
          test -s build/windows/KatanaShotgun.exe
          test -s build/linux/KatanaShotgun.x86_64
          chmod +x build/linux/KatanaShotgun.x86_64
          ls -la build/*

      - name: Check the Linux build starts and plays
        run: |
          timeout 120 build/linux/KatanaShotgun.x86_64 --headless --quit-after 600 -- --autoplay --god 2>&1 | tee exported.log
          grep -q "^\[t=" exported.log
          ! grep -qE "SCRIPT ERROR|Parse Error" exported.log

      - uses: actions/upload-artifact@v7
        with:
          name: builds
          path: build/
          retention-days: 7

  installer:
    name: Windows installer
    needs: [version, export]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: builds
          path: build

      - name: Build the installer with Inno Setup
        shell: pwsh
        env:
          VER: ${{ needs.version.outputs.version }}
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup (ISCC.exe) not found" }
          Write-Host "Using $($iscc.FullName)"
          & $iscc.FullName "/DAppVersion=$env:VER" installer\KatanaShotgun.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem dist

      - name: Check the installer installs and uninstalls silently
        shell: pwsh
        env:
          VER: ${{ needs.version.outputs.version }}
        run: |
          $setup = "dist\KatanaShotgun-v$env:VER-Windows-Setup.exe"
          $dir = "$env:RUNNER_TEMP\KatanaShotgunTest"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          if (-not (Test-Path "$dir\KatanaShotgun.exe")) { throw "game exe missing after install" }
          $p = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstaller exit code $($p.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\KatanaShotgun.exe") { throw "game exe still there after uninstall" }
          Write-Host "Install and uninstall OK"

      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: dist/*.exe
          retention-days: 7

  release:
    name: Package and publish
    needs: [version, export, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VER: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: builds
          path: art/builds

      - uses: actions/download-artifact@v8
        with:
          name: installer
          path: art/installer

      - name: Package the downloads
        run: |
          set -euo pipefail
          mkdir -p dist
          cp art/installer/*.exe dist/
          (cd art/builds/windows && zip -9 "$GITHUB_WORKSPACE/dist/KatanaShotgun-v${VER}-Windows-Portable.zip" KatanaShotgun.exe)
          chmod +x art/builds/linux/KatanaShotgun.x86_64
          (cd art/builds/linux && zip -9 "$GITHUB_WORKSPACE/dist/KatanaShotgun-v${VER}-Linux.zip" KatanaShotgun.x86_64)
          if [ -f art/builds/macos/KatanaShotgun.zip ]; then
            cp art/builds/macos/KatanaShotgun.zip "dist/KatanaShotgun-v${VER}-macOS.zip"
          fi
          ls -la dist

      - name: Release notes from the changelog
        run: tools/changelog_section.sh "$VER" > release_notes.md; cat release_notes.md

      - name: Keep the packaged downloads (dry runs too)
        uses: actions/upload-artifact@v7
        with:
          name: KatanaShotgun-v${{ env.VER }}
          path: dist/*
          retention-days: 14

      - name: Publish the GitHub Release
        if: needs.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VER }}
          target_commitish: ${{ github.sha }}
          name: KATANA / SHOTGUN v${{ env.VER }}
          body_path: release_notes.md
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: dist/*
